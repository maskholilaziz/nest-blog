syntax="proto3";
package password;

message MultiLanguageResponse {
  optional string id = 1;
  optional string en = 2;
}

message CreatePasswordRequest {
  string user_id = 1;
  string id_number = 2;
  string password = 3;
}

message CreatePasswordResponse {
  string code = 1;
  MultiLanguageResponse message = 2;
  optional string data = 3;
}